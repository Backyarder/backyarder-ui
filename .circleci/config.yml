version: 2.1
orbs:
  node: circleci/node@5.1.0
  cypress: cypress-io/cypress@3.1.3

# Hosted checks are off for now (2026-11-12): CircleCI's deploy key for this
# repo no longer works, so every job failed at checkout. Run checks locally
# with `bash scripts/local-checks.sh`. To run the hosted workflow on purpose,
# trigger the pipeline with the parameter run_checks=true (after fixing the
# project's SSH key in CircleCI Project Settings).
parameters:
  run_checks:
    type: boolean
    default: false

jobs:
  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run build
          command: npm run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
workflows:
  test_my_app:
    when: << pipeline.parameters.run_checks >>
    jobs:
      - cypress/run: 
          cypress-command: npx cypress run --browser electron
          # install-browsers: true
          start-command: npm start
      - build
